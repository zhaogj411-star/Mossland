# @package _global_

project_name: codicodec-overfit-small
checkpoint_monitor: loss
tags: ["audioCodec", "codicodec", "overfit-small", "continuous-scm", "rvq", "shift"]
seed: 42
resume_from_ckpt: null
pretrain_ckpt_path: null
checkpoint_every_n_train_steps: 100

trainer:
  devices: 1
  strategy: ddp_find_unused_parameters_true
  precision: 32-true
  max_steps: 30000
  max_epochs: 10000000
  accumulate_grad_batches: 1
  gradient_clip_val: 1
  log_every_n_steps: 1
  num_sanity_val_steps: 0
  check_val_every_n_epoch: null
  enable_progress_bar: true

data:
  _target_: scripts.data.datasets.Experiment_Dataset
  dataset:
    _target_: scripts.data.datasets.PTDataset
    folder_path: tmp/codicodec_overfit100_pt
    files_list: tmp/codicodec_overfit100_pt/files.list
    mainkey: audio
    infokeys: []
    target_length: 62400 # 2 chunks at hop=960/spec_length=32; shift leaves 1 boundary-mismatched decode chunk
    nums: 10000000
    sub_length: 4
    use_multiple_start: false
    if_random_crop: false
  pin_memory: true
  val_split: null
  train_batch_size: 1
  val_batch_size: 1
  num_workers: 0
  prefetch_factor: null

model:
  _target_: scripts.codicodec.models.UNet
  sample_rate: 48000
  stereo: true
  mixed_precision: false
  audio_processor:
    _target_: scripts.codicodec.audio.AudioProcessor
    alpha_rescale: 0.65
    beta_rescale: 0.34
    hop_size: 960
    fac: 2
    center_pad: false
  dim: 64
  head_dim: 32
  heads: 2
  mlp_mult: 2
  pos_emb: learned
  num_layers: 1
  num_layers_encoder: 1
  cond_channels: 64
  num_latents: 128
  num_more_latents: 0
  bottleneck_channels: 4
  latent_tanh_scale: 0.3
  frontend_base_channels: 16
  frontend_multipliers_list: [1, 2, 4, 4]
  frontend_layers_list: [1, 1, 1, 1]
  frontend_encoder_layers_list: [1, 1, 1, 1]
  frontend_freq_downsample_list: [0, 1, 0]
  spec_length: 32
  sigma_data: 0.333
  t_min: 0.006
  t_max: 1.5666
  default_denoising_steps: 1
  quantizer_num_quantizers: 2
  quantizer_codebook_size: 64
  quantizer_codebook_dim: null
  rvq_dim: 64
  quantizer_dropout: 1.0
  quantizer_decay: 0.99
  quantizer_kmeans_init: true
  quantizer_kmeans_iters: 10
  quantizer_threshold_ema_dead_code: 2

wrapper:
  _target_: scripts.codicodec.wrapper.CoDiCodecTrainingWrapper
  use_ema: true
  ema_beta: 0.999
  learning_rate: 3e-4
  weight_decay: 0.0
  optimizer_name: adamw
  lr_schedule: cosine_decay
  lr_warmup_steps: 10
  lr_schedule_total_steps: 300
  final_learning_rate: 1e-5
  random_mix_prob: 0.0
  train_num_chunks: null
  rvq_commitment_weight: 0.0
  rvq_codebook_weight: 0.0
  rvq_hidden_recon_weight: 0.0
  rvq_latent_train_prob: 0.25
  rvq_detach_encoder: false
  train_n_quantizers: null
  train_n_quantizers_choices: [1, 2]
  latent_time_shift_prob: 1.0
  latent_time_shift_max_tokens: null
  latent_time_shift_loss_weight: 1.0
  p_mean: -1.1
  p_std: 2.0
  tangent_warmup_steps: 100
  tangent_norm_const: 0.1
  adaptive_weight_dim: 64
  use_jvp_tangent: true
  consistency_weight: 1.0
  direct_denoise_weight: 1e-3
  direct_denoise_mode: trigflow_noise
  direct_detach_encoder: false
  decode_initial_state: noise
  fail_on_nonfinite: true
  fail_on_nonfinite_grad: false

callbacks:
  demo_callback:
    _target_: scripts.codicodec.wrapper.CoDiCodecTrainingCallback
    demo_dir: ${paths.output_dir}/demos
    demo_num: 2
    demo_every: 100
    sample_rate: 48000
    demo_n_quantizers_choices: [1, 2]
    use_ema: false
    silence_seconds: 0.25
    demo_seconds: 5.0
