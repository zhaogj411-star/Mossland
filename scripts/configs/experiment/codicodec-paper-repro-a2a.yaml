# @package _global_

# Mossland audio-to-audio multitask training without codec latent tokens.
#
# Separation tasks use MUSDB18-HQ stems. Super-resolution and mono-to-stereo
# use raw NETEASE_SPIDER audio in the same training stream.

project_name: codicodec-paper-repro-a2a
checkpoint_monitor: loss
tags: ["a2a", "audioSeparation", "superResolution", "monoToStereo", "no-latent-bottleneck", "mossland"]
seed: 42
resume_from_ckpt: null
pretrain_ckpt_path: null
checkpoint_every_n_train_steps: 2000

data:
  _target_: scripts.data.datasets.Experiment_Dataset
  dataset:
    _target_: scripts.mossland-codec.tasks.MosslandTaskRoutedDataset
    datasets:
      separate_vocals:
        _target_: scripts.data.datasets.Musdb18HqSeparationDataset
        dirs:
          - /inspire/sj-ssd3/project/embodied-multimodality/public/Sonata/data/dataset/musdb18hq
        splits: ["train"]
        sample_size: 66560
        sample_rate: 44100
        random_crop: true
        num_channels: 2
        strict: false
        scan_fallback: true
        index_file: /inspire/sj-ssd3/project/embodied-multimodality/public/Sonata/data/dataset/musdb18hq/musdb18hq_train.index.list
        crops_per_file: 1
        length: 1000000
      separate_drums:
        _target_: scripts.data.datasets.Musdb18HqSeparationDataset
        dirs:
          - /inspire/sj-ssd3/project/embodied-multimodality/public/Sonata/data/dataset/musdb18hq
        splits: ["train"]
        sample_size: 66560
        sample_rate: 44100
        random_crop: true
        num_channels: 2
        strict: false
        scan_fallback: true
        index_file: /inspire/sj-ssd3/project/embodied-multimodality/public/Sonata/data/dataset/musdb18hq/musdb18hq_train.index.list
        crops_per_file: 1
        length: 1000000
      separate_bass:
        _target_: scripts.data.datasets.Musdb18HqSeparationDataset
        dirs:
          - /inspire/sj-ssd3/project/embodied-multimodality/public/Sonata/data/dataset/musdb18hq
        splits: ["train"]
        sample_size: 66560
        sample_rate: 44100
        random_crop: true
        num_channels: 2
        strict: false
        scan_fallback: true
        index_file: /inspire/sj-ssd3/project/embodied-multimodality/public/Sonata/data/dataset/musdb18hq/musdb18hq_train.index.list
        crops_per_file: 1
        length: 1000000
      separate_other:
        _target_: scripts.data.datasets.Musdb18HqSeparationDataset
        dirs:
          - /inspire/sj-ssd3/project/embodied-multimodality/public/Sonata/data/dataset/musdb18hq
        splits: ["train"]
        sample_size: 66560
        sample_rate: 44100
        random_crop: true
        num_channels: 2
        strict: false
        scan_fallback: true
        index_file: /inspire/sj-ssd3/project/embodied-multimodality/public/Sonata/data/dataset/musdb18hq/musdb18hq_train.index.list
        crops_per_file: 1
        length: 1000000
      super_resolution:
        _target_: scripts.data.datasets.SampleDataset
        dirs:
          - /inspire/sj-ssd3/project/embodied-multimodality/public/Sonata/data/raw/NETEASE_SPIDER
        sample_size: 66560
        sample_rate: 44100
        random_crop: true
        num_channels: 2
        crops_per_file: 1
        audio_cache_dir: /inspire/sj-ssd3/project/embodied-multimodality/public/Sonata/data/raw/NETEASE_SPIDER/.audio_cache_44100_stereo
        index_file: /inspire/sj-ssd3/project/embodied-multimodality/public/Sonata/data/raw/NETEASE_SPIDER/index_audio.list
      mono_to_stereo:
        _target_: scripts.data.datasets.SampleDataset
        dirs:
          - /inspire/sj-ssd3/project/embodied-multimodality/public/Sonata/data/raw/NETEASE_SPIDER
        sample_size: 66560
        sample_rate: 44100
        random_crop: true
        num_channels: 2
        crops_per_file: 1
        audio_cache_dir: /inspire/sj-ssd3/project/embodied-multimodality/public/Sonata/data/raw/NETEASE_SPIDER/.audio_cache_44100_stereo
        index_file: /inspire/sj-ssd3/project/embodied-multimodality/public/Sonata/data/raw/NETEASE_SPIDER/index_audio.list
    active_tasks:
      - separate_vocals
      - separate_drums
      - separate_bass
      - separate_other
      - super_resolution
      - mono_to_stereo
    task_weights:
      separate_vocals: 1.0
      separate_drums: 1.0
      separate_bass: 1.0
      separate_other: 1.0
      super_resolution: 1.0
      mono_to_stereo: 1.0
    sample_rate: 44100
    low_sample_rate: [8000, 40000]
    length: 1000000
  pin_memory: true
  val_split: 0.01
  train_batch_size: 4
  val_batch_size: 4
  num_workers: 8
  prefetch_factor: 2

trainer:
  devices: 8
  precision: bf16-mixed
  strategy: ddp_find_unused_parameters_true
  log_every_n_steps: 10
  max_steps: 20000
  max_epochs: 10000000
  min_epochs: 0
  accumulate_grad_batches: 1
  gradient_clip_val: 1

model:
  _target_: scripts.mossland-a2a.models.MosslandA2ATransformer
  mixed_precision: true
  stereo: true
  default_denoising_steps_parallel: 5
  hop: 1024
  fac: 2
  sample_rate: 44100
  alpha_rescale: 0.65
  beta_rescale: 0.34
  dim: 512
  head_dim: 128
  mlp_mult: 4
  pos_emb: learned
  num_layers: 12
  num_layers_encoder: 12
  cond_channels: 512
  num_more_latents: 0
  use_fsq: false
  frontend_base_channels: 64
  frontend_multipliers_list: [1, 2, 4, 8]
  frontend_layers_list: [3, 3, 3, 1]
  frontend_freq_downsample_list: [0, 1, 0]
  spec_length: 32
  sigma_min: 0.002
  sigma_max: 80.0
  sigma_data: 0.5
  rho: 7.0
  max_batch_size_decode: 32
  sigma_rescale: 0.8
  task_embedding_init_std: 0.02

wrapper:
  _target_: scripts.mossland-a2a.wrapper.MosslandA2ATrainingWrapper
  use_ema: true
  ema_beta: 0.9999
  learning_rate: 1e-4
  weight_decay: 0.0
  optimizer_name: radam
  lr_schedule: cosine_decay
  lr_warmup_steps: 100
  lr_schedule_total_steps: 20000
  random_mix_prob: 0.0
  fsq_dropout_prob: 0.0
  consistency_step: 0.1
  consistency_step_schedule: exponential
  consistency_step_total_steps: 20000
  consistency_step_end_exp: 2.0
  sigma_sampling: lognormal
  lognormal_mean: -1.1
  lognormal_std: 2.0
  consistency_loss_delta: 0.00054
  consistency_min_sigma_delta: 0.001
  index_data_every_step: null
  fail_on_nonfinite: true

callbacks:
  demo_callback:
    _target_: scripts.mossland-a2a.wrapper.MosslandA2ATrainingCallback
    demo_dir: ${paths.output_dir}/demos
    demo_num: 2
    demo_every: 1000
    sample_rate: 44100
    use_ema: true
    silence_seconds: 0.25
