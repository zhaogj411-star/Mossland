# @package _global_
# Mossland codec raw-audio 3-task 训练配置。
# 数据直接读取单文件音频，只训练 reconstruct / super_resolution / mono_to_stereo。

project_name: mossland-codec-raw-3tasks
checkpoint_monitor: loss/total
tags: ["audioCodec", "mossland-codec", "mossland-rvq", "raw-audio", "3task", "stereo"]
seed: 42
resume_from_ckpt: null
# task embedding 的行数会从 5 变成 3；scripts/train.py 会按 shape 兼容加载，
# 因此已有 5-task checkpoint 可作为其余权重初始化来源。
pretrain_ckpt_path: /inspire/sj-ssd3/project/embodied-multimodality/public/zhaoguojie/Mossland/ckpt/mosslandcodec0623/checkpoint.ckpt
checkpoint_every_n_train_steps: 2000

trainer:
  devices: [0, 1, 2, 3, 4, 5, 6, 7]
  strategy: ddp
  precision: bf16-mixed
  max_steps: 800000
  max_epochs: 10000000
  gradient_clip_val: 0.3
  log_every_n_steps: 10
  num_sanity_val_steps: 0
  check_val_every_n_epoch: null

data:
  _target_: scripts.data.datasets.Experiment_Dataset
  dataset:
    _target_: scripts.mossland_codec.tasks.MosslandTaskDataset
    dataset:
      _target_: scripts.data.datasets.SampleDataset
      dirs:
        - /inspire/sj-ssd3/project/embodied-multimodality/public/Sonata/data/raw/NETEASE_SPIDER
      sample_size: 112500
      sample_rate: 44100
      random_crop: true
      num_channels: 2
      audio_cache_dir: null
      crops_per_file: 4
      index_file: /inspire/sj-ssd3/project/embodied-multimodality/public/Sonata/data/raw/NETEASE_SPIDER/index_audio.list
      max_duration_seconds: 300
      length: 10000000
    active_tasks:
      - reconstruct
      - super_resolution
      - mono_to_stereo
    task_weights:
      reconstruct: 6.0
      super_resolution: 1.0
      mono_to_stereo: 1.0
    sample_rate: 44100
    low_sample_rate: [8000, 40000]
  pin_memory: true
  val_split: null
  train_batch_size: 1
  val_batch_size: 1
  num_workers: 8
  prefetch_factor: 2

model:
  _target_: scripts.mossland_codec.models.MosslandCodec
  sample_rate: 44100
  base_channels: 128
  data_channels: 4
  hop: 512
  mixed_precision: false
  bottleneck_channels: 64
  bottleneck_base_channels: 1024
  num_bottleneck_layers: 9
  quantizer_num_quantizers: 32
  quantizer_codebook_size: 4096
  quantizer_codebook_dim: null
  quantizer_dropout: 1.0
  quantizer_decay: 0.99
  quantizer_kmeans_init: true
  quantizer_kmeans_iters: 10
  quantizer_threshold_ema_dead_code: 2
  task_names:
    - reconstruct
    - super_resolution
    - mono_to_stereo
  task_embedding_init_std: 0.02
  heads: 8
  cond_channels: 512
  use_fourier: false
  fourier_scale: 0.2
  normalization: true
  dropout_rate: 0.0
  min_res_dropout: 16
  init_as_zero: true
  sigma_min: 0.002
  sigma_max: 80.0
  rho: 7.0
  sigma_data: 0.5
  layers_list: [3, 4, 5, 5, 4]
  multipliers_list: [1, 2, 4, 4, 4]
  attention_list: [0, 0, 1, 1, 1]
  freq_downsample_list: [1, 0, 0, 0]
  layers_list_encoder: [2, 3, 4, 4, 3]
  attention_list_encoder: [0, 0, 1, 1, 1]
  frequency_scaling: true
  pre_normalize_2d_to_1d: true
  pre_normalize_downsampling_encoder: true
  audio_processor:
    _target_: scripts.mossland_codec.audio.AudioProcessor
    alpha_rescale: 0.65
    beta_rescale: 0.34
    hop_size: 512
    fac: 4
    center_pad: false

wrapper:
  _target_: scripts.mossland_codec.wrapper.MosslandCodecTrainingWrapper
  use_ema: true
  ema_beta: 0.9999
  learning_rate: 1e-4
  weight_decay: 0.0
  optimizer_name: radam
  lr_schedule: cosine_decay
  lr_warmup_steps: 1000
  lr_schedule_total_steps: 500000
  final_learning_rate: 1e-6
  rvq_commitment_weight: 0.0
  rvq_codebook_weight: 0.0
  rvq_hidden_recon_weight: 0.0
  rvq_latent_train_prob: 0.2
  rvq_detach_encoder: true
  train_n_quantizers: null
  train_n_quantizers_choices: [8, 16, 32]
  consistency_step: 0.1
  consistency_step_schedule: exponential
  consistency_step_total_steps: 500000
  consistency_step_end_exp: 3.0
  sigma_sampling: lognormal
  lognormal_mean: -1.1
  lognormal_std: 2.0
  consistency_loss_delta: 0.00054
  consistency_min_sigma_delta: 0.001
  index_data_every_step: null
  fail_on_nonfinite: true
  fail_on_nonfinite_grad: false

callbacks:
  demo_callback:
    _target_: scripts.mossland_codec.wrapper.MosslandCodecTrainingCallback
    demo_dir: ${paths.output_dir}/demos
    demo_num: 2
    demo_every: 1000
    sample_rate: 44100
    demo_n_quantizers_choices: [8, 16, 32]
    denoising_steps: 1
    demo_seed: 1234
    silence_seconds: 0.25
    use_ema: true

