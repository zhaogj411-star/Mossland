# @package _global_

project_name: moss-audio-flowcodec
checkpoint_monitor: loss
tags: ["audioCodec", "moss-audio-flowcodec", "local-transformer", "rvq1024", "no-adv"]
seed: null
resume_from_ckpt: null
pretrain_ckpt_path: null
checkpoint_every_n_train_steps: 5000

data:
  _target_: scripts.data.datasets.Experiment_Dataset
  dataset:
    _target_: scripts.data.datasets.SampleDataset
    dirs: ["/inspire/sj-ssd3/project/embodied-multimodality/public/Sonata/data/raw/NETEASE_SPIDER"]
    sample_size: 480000 # 10 seconds at 48 kHz; 250 tokens at 25 Hz
    sample_rate: 48000
    random_crop: true
    num_channels: 2
    crops_per_file: 2
    index_file: tmp/moss-audio-flowcodec/netease_spider_audio.index.list
    audio_cache_dir: null
  pin_memory: true
  val_split: 0.0001
  train_batch_size: 1
  val_batch_size: 1
  num_workers: 4
  prefetch_factor: 2

trainer:
  log_every_n_steps: 10

model:
  _target_: scripts.moss_audio_flowcodec.models.MossAudioFlowCodec
  sample_rate: 48000
  audio_channels: 2
  encoder_dim: 76
  encoder_rates: [5, 4, 4, 4, 3, 2] # product 1920: 48000 Hz -> 25 Hz
  latent_dim: 1024
  decoder_dim: 1024
  decoder_rates: [2, 3, 4, 4, 4, 5]
  num_quantizers: 32 # 32 RVQ codebooks at 25 Hz
  codebook_size: 1024 # vocabulary size per codebook
  codebook_dim: 8 # independent RVQ embedding dim; not tied to 32 codebooks
  quantizer_dropout: 0.0
  continuous_dim: 32 # continuous tokens are [B, 32, 25 Hz]
  local_transformer_layers: 8
  local_transformer_heads: 8
  local_transformer_context: 25 # one second of 25 Hz tokens
  local_transformer_causal: true
  local_transformer_ff_mult: 4
  local_transformer_positional_embedding: rope
  local_transformer_attention: sdpa

wrapper:
  _target_: scripts.moss_audio_flowcodec.wrapper.MossAudioFlowCodecTrainingWrapper
  learning_rate: 1e-4
  weight_decay: 0.0
  optimizer_name: adamw
  lr_schedule: cosine_decay
  lr_warmup_steps: 10000
  lr_schedule_total_steps: 1000000
  waveform_loss_weight: 1.0
  stft_loss_weight: 1.0
  discrete_loss_weight: 1.0
  continuous_loss_weight: 1.0
  commitment_loss_weight: 0.25
  codebook_loss_weight: 1.0
  # null = train full 32-codebook rate. Set choices such as [4, 8, 16, 32]
  # to train one checkpoint that supports multiple discrete bitrates.
  train_n_quantizers: null
  train_n_quantizers_choices: null
  fail_on_nonfinite: true

callbacks:
  demo_callback:
    _target_: scripts.moss_audio_flowcodec.wrapper.MossAudioFlowCodecCallback
    demo_dir: ${paths.output_dir}/demos
    demo_num: 2
    demo_every: 5000
    sample_rate: 48000
    silence_seconds: 0.25
    save_separate_files: false
    save_tokens: false
