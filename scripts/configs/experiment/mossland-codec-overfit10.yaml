# @package _global_

project_name: mossland-codec-overfit10
checkpoint_monitor: loss
tags: ["audioCodec", "mossland-codec", "rvq", "overfit10"]
seed: 1234
resume_from_ckpt: null
pretrain_ckpt_path: null
checkpoint_every_n_train_steps: 25

data:
  _target_: scripts.data.datasets.Experiment_Dataset
  dataset:
    _target_: scripts.mossland-codec.tasks.MosslandTaskDataset
    dataset:
      _target_: scripts.data.datasets.PreparedSeparationDataset
      dirs: ["/inspire/qb-ilm2/project/embodied-multimodality/public/zhaoguojie/data/NETEASE_SPIDER_SEPERATION_NEW"]
      index_file: ${paths.root_dir}/scripts/configs/experiment/mossland-codec-overfit10.index.list
      sample_size: 66560
      sample_rate: 48000
      random_crop: false
      num_channels: 2
      strict: true
      max_duration_seconds: null
      length: 1000000
    active_tasks:
      - reconstruct
    task_weights:
      reconstruct: 1.0
    sample_rate: 48000
    low_sample_rate: [16000, 16000]
  pin_memory: true
  val_split: null
  train_batch_size: 1
  val_batch_size: 1
  num_workers: 0
  prefetch_factor: 1

trainer:
  devices: [0]
  strategy: auto
  max_steps: 80
  min_epochs: 0
  max_epochs: 1000000
  num_sanity_val_steps: 0
  log_every_n_steps: 1
  enable_model_summary: true
  limit_val_batches: 0

model:
  _target_: scripts.mossland-codec.models.MosslandCodecTransformer
  mixed_precision: true
  stereo: true
  default_time_prompt: 0.4
  default_denoising_steps_parallel: 5
  default_denoising_steps_ar: 2
  hop: 1024
  fac: 2
  sample_rate: 48000
  alpha_rescale: 0.65
  beta_rescale: 0.34
  dim: 128
  head_dim: 32
  mlp_mult: 4
  pos_emb: learned
  num_layers: 2
  num_layers_encoder: 2
  cond_channels: 128
  latent_rate_hz: 25
  token_dim: 32
  rvq_codebook_size: 1024
  rvq_max_quantizers: 16
  encoder_local_window_tokens: 16
  encoder_local_transformer_layers: 2
  encoder_local_transformer_heads: 4
  use_rvq: true
  frontend_base_channels: 32
  frontend_multipliers_list: [1, 2, 4, 4]
  frontend_layers_list: [1, 1, 1, 1]
  frontend_encoder_layers_list: [1, 1, 1, 1]
  frontend_freq_downsample_list: [0, 1, 0]
  spec_length: 32
  sigma_min: 0.002
  sigma_max: 80.0
  sigma_data: 0.5
  rho: 7.0
  max_batch_size_encode: 8
  max_batch_size_decode: 8
  sigma_rescale: 0.8

wrapper:
  _target_: scripts.mossland-codec.wrapper.MosslandCodecTrainingWrapper
  use_ema: true
  ema_beta: 0.999
  learning_rate: 1e-4
  weight_decay: 0.0
  optimizer_name: radam
  lr_schedule: cosine_decay
  lr_warmup_steps: 0
  lr_schedule_total_steps: 80
  rvq_dropout_prob: 0.0
  rvq_warmup_steps: 0
  rvq_loss_weight: 1.0
  rvq_active_quantizers: 16
  consistency_step: 0.1
  consistency_step_schedule: exponential
  consistency_step_total_steps: 80
  consistency_step_end_exp: 2.0
  sigma_sampling: lognormal
  lognormal_mean: -1.1
  lognormal_std: 2.0
  consistency_loss_delta: 0.00054
  consistency_min_sigma_delta: 0.001
  index_data_every_step: null
  fail_on_nonfinite: true

callbacks:
  demo_callback:
    _target_: scripts.mossland-codec.wrapper.MosslandCodecTrainingCallback
    demo_dir: ${paths.output_dir}/demos
    demo_num: 1
    demo_every: 10
    sample_rate: 48000
    use_ema: true
    silence_seconds: 0.25
